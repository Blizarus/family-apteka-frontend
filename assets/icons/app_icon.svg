<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Card Background Gradient (Clean Health-Tech Mint / Pure White) -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F4FCF9" />
      <stop offset="100%" stop-color="#E2F7F1" />
    </linearGradient>

    <!-- Medical Cross Warm Halo / Glow -->
    <radialGradient id="crossAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.42" />
      <stop offset="35%" stop-color="#FB7185" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#FB7185" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.0" />
    </radialGradient>

    <!-- Parent Gradient: Deep Teal (#0F766E palette) -->
    <linearGradient id="parentGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#115E59" />
      <stop offset="45%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Child Gradient: Bright Mint / Turquoise (#14B8A6 palette) -->
    <linearGradient id="childGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3CD5AF" />
      <stop offset="50%" stop-color="#24C2A3" />
      <stop offset="100%" stop-color="#109B84" />
    </linearGradient>

    <!-- Cross Gradient: Warm Coral Red (#F43F5E palette) -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Card -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F766E" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- 0. BASE SQUIRCLE CARD (FOR APP STORE & WEB)    -->
  <!-- ============================================== -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116"
        fill="url(#cardBg)" stroke="#CCFBF1" stroke-width="3" filter="url(#cardShadow)" />

  <!-- ============================================== -->
  <!-- 1. WARM RED AURA BEHIND CROSS                  -->
  <!-- ============================================== -->
  <circle cx="256" cy="250" r="105" fill="url(#crossAura)" />

  <!-- ============================================== -->
  <!-- 2. PARENT FIGURE (DEEP TEAL - LEFT EMBRACE)    -->
  <!-- ============================================== -->
  <g id="parent">
    <!-- Parent Head -->
    <circle cx="178" cy="128" r="42" fill="url(#parentGrad)" />

    <!-- Parent Torso & Hugging Arm -->
    <path d="M 178 174
             C 134 182, 94 224, 82 278
             C 68 344, 118 410, 256 450
             C 214 394, 150 348, 140 292
             C 132 248, 160 210, 202 202
             C 222 198, 238 208, 240 224
             C 242 238, 228 250, 214 252
             C 192 256, 174 274, 174 294
             C 174 316, 194 348, 236 378
             C 202 344, 184 310, 188 284
             C 192 258, 216 244, 238 238
             C 218 218, 198 192, 178 174 Z"
          fill="url(#parentGrad)" />
  </g>

  <!-- ============================================== -->
  <!-- 3. CHILD FIGURE (MINT TURQUOISE - RIGHT WING)  -->
  <!-- ============================================== -->
  <g id="child">
    <!-- Child Head -->
    <circle cx="348" cy="276" r="30" fill="url(#childGrad)" />

    <!-- Protective Upper Crescent (Right Heart Lobe) -->
    <path d="M 288 184
             C 334 140, 396 138, 426 182
             C 452 222, 448 290, 420 348
             C 382 414, 286 442, 256 450
             C 288 424, 358 392, 386 342
             C 408 302, 404 248, 376 212
             C 348 176, 308 178, 288 184 Z"
          fill="url(#childGrad)" />

    <!-- Child Body Swoop Reaching Down -->
    <path d="M 334 300
             C 316 326, 284 372, 248 402
             C 282 376, 324 346, 348 312
             C 354 302, 342 292, 334 300 Z"
          fill="url(#childGrad)" />
  </g>

  <!-- ============================================== -->
  <!-- 4. MEDICAL CROSS (WARM CORAL RED IN CENTER)    -->
  <!-- ============================================== -->
  <g id="medical-cross" transform="translate(256, 250)">
    <rect x="-17" y="-52" width="34" height="104" rx="10" ry="10" fill="url(#crossGrad)" />
    <rect x="-52" y="-17" width="104" height="34" rx="10" ry="10" fill="url(#crossGrad)" />
  </g>
</svg>